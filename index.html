<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
  <title>Primrose Login</title>
</head>
<body>
  <div class="container">
    <div class= "name">
    <h2>Welcome to AlehaRose!</h2>
    <p>where every moment blooms.</p> 
    </div>
      
    <form id="loginForm">
      <div class="input-group">
        <input type="email" class ="text" placeholder="Email" id="email" required>
          <br></br>
     
        <input type="password" class="text" placeholder="Password" id="password" required>
      </div>
          <div class= "set">
       <input type="checkbox" id="remember" name="remember">
       <label for="remember">Remember me </label>
         
         <a href="#">Forgot password</a>
         </div>
                                                                                
      <div class="actions">
        <button type="submit" class="login-btn">Login</button>
        <p id="message"></p> 
      </div>
            
            <p class="reg">Don't have an account?<a href="#"> Register
    </form>
  </div>
    
  <script src="script.js"></script>
</body>
</html>
